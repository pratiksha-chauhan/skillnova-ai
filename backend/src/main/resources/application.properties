spring.application.name=backend

# Active profile selects datasource + environment-specific behavior.
# Local development defaults to "dev"; deployments set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway owns the schema. Hibernate must never auto-generate DDL,
# it only validates that entity mappings match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT signing secret and access-token lifetime. No default here on purpose:
# dev profile supplies a local-only fallback; prod MUST set JWT_SECRET via
# env var or the app fails fast at startup instead of silently signing
# tokens with a placeholder secret.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}