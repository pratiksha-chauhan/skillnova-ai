spring.application.name=backend

# Active profile selects datasource + environment-specific behavior.
# Local development defaults to "dev"; deployments set SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Flyway owns the schema. Hibernate must never auto-generate DDL,
# it only validates that entity mappings match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT signing secret and access-token lifetime. No default here on purpose:
# dev profile supplies a local-only fallback; prod MUST set JWT_SECRET via
# env var or the app fails fast at startup instead of silently signing
# tokens with a placeholder secret.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Gemini (Google AI Studio) roadmap-generation provider. No default for the
# key - the app fails fast at startup rather than silently running with a
# missing/placeholder key. Free-tier key: https://aistudio.google.com/apikey
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

# Frontend origin(s) allowed to call this API cross-origin (Phase 12).
# Comma-separated. Dev defaults to the local Next.js dev server; prod sets
# CORS_ALLOWED_ORIGINS to the deployed Vercel frontend URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}