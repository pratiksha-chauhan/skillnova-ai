# Production datasource (Neon PostgreSQL). All values are supplied via
# environment variables at deploy time (Render) and must never be committed.
#
# DB_URL example for Neon: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.jpa.show-sql=false

logging.level.org.flywaydb=INFO
