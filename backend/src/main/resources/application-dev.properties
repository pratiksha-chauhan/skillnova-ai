# Local development datasource (Docker Compose Postgres, see /docker-compose.yml).
# Host port 5433 avoids clashing with a locally installed Postgres on 5432.
spring.datasource.url=jdbc:postgresql://localhost:${DB_HOST_PORT:5433}/skillnova
spring.datasource.username=${DB_USERNAME:skillnova}
spring.datasource.password=${DB_PASSWORD:skillnova}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

# Dev-only fallback signing secret (>= 256 bits for HS256) so local runs work
# without exporting JWT_SECRET. Never used in prod - application-prod.properties
# has no fallback, so prod fails fast if the env var is missing.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-0123456789}
