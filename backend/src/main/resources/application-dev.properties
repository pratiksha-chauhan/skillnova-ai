# Local development datasource (Docker Compose Postgres, see /docker-compose.yml).
# Host port 5433 avoids clashing with a locally installed Postgres on 5432.
spring.datasource.url=jdbc:postgresql://localhost:${DB_HOST_PORT:5433}/skillnova
spring.datasource.username=${DB_USERNAME:skillnova}
spring.datasource.password=${DB_PASSWORD:skillnova}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
